<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship API Explorer | Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-card: rgba(18, 24, 43, 0.75);
      --bg-card-hover: rgba(26, 34, 60, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: rgba(99, 102, 241, 0.15);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --accent: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0a0f1d 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-badge {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .brand-text h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .header-pills {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.03);
    }

    .pill-green {
      background: var(--success-light);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.25);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Action bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .filters-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      flex: 1;
      min-width: 300px;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      background: rgba(18, 24, 43, 0.9);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .filter-select {
      background: rgba(18, 24, 43, 0.9);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .filter-select:focus {
      border-color: var(--border-focus);
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4338ca);
      color: white;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #3730a3);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
    }

    .card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-3px);
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: white;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .card-company {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    .type-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .type-remote {
      background: var(--success-light);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .type-hybrid {
      background: var(--primary-light);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    .type-onsite {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
      margin: 12px 0;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-desc {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 16px;
      flex: 1;
    }

    .skills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .skill-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .stipend-badge {
      font-size: 16px;
      font-weight: 700;
      color: #34d399;
    }

    .stipend-label {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      font-weight: 400;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-danger {
      background: var(--danger-light);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    /* Pagination */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 14px 20px;
      border-radius: 14px;
      margin-bottom: 36px;
    }

    .pagination-info {
      font-size: 14px;
      color: var(--text-muted);
    }

    .pagination-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* API Inspector Drawer */
    .inspector-section {
      background: rgba(13, 18, 33, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
    }

    .inspector-header {
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .inspector-header h3 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-req {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
    }

    .inspector-body {
      padding: 16px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #93c5fd;
      max-height: 240px;
      overflow-y: auto;
      background: #060a14;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-content {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e2e8f0;
    }

    .form-control {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: white;
      outline: none;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .alert-error {
      background: var(--danger-light);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo-badge">⚡</div>
        <div class="brand-text">
          <h1>Internship REST API</h1>
          <p>Node.js • Express.js • SQLite • RESTful Services</p>
        </div>
      </div>
      <div class="header-pills">
        <div class="pill pill-green">
          <span class="pill-dot"></span> API Server Active
        </div>
        <div class="pill">
          <span>💾 SQLite Persistent</span>
        </div>
        <div class="pill">
          <span>Port 5000</span>
        </div>
      </div>
    </header>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="filters-group">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search title, company, skills...">
        <select id="domainFilter" class="filter-select">
          <option value="">All Domains</option>
          <option value="Web Development">Web Development</option>
          <option value="Frontend Development">Frontend Development</option>
          <option value="Backend Development">Backend Development</option>
          <option value="Mobile Development">Mobile Development</option>
          <option value="Data Science">Data Science</option>
          <option value="DevOps & Cloud">DevOps & Cloud</option>
          <option value="Cybersecurity">Cybersecurity</option>
          <option value="Artificial Intelligence">Artificial Intelligence</option>
        </select>
        <select id="typeFilter" class="filter-select">
          <option value="">All Types</option>
          <option value="Remote">Remote</option>
          <option value="Hybrid">Hybrid</option>
          <option value="On-site">On-site</option>
        </select>
      </div>
      <button id="openCreateModalBtn" class="btn btn-primary">
        <span>+</span> Post New Internship
      </button>
    </div>

    <!-- Internships Grid -->
    <div id="internshipsGrid" class="grid">
      <!-- Populated dynamically -->
    </div>

    <!-- Pagination Controls -->
    <div class="pagination-bar">
      <div id="paginationInfo" class="pagination-info">
        Showing 0 of 0 records
      </div>
      <div class="pagination-buttons">
        <button id="prevPageBtn" class="btn btn-outline" disabled>← Previous</button>
        <span id="pageBadge" style="font-size: 13px; font-weight: 600; padding: 0 8px;">Page 1</span>
        <button id="nextPageBtn" class="btn btn-outline" disabled>Next →</button>
      </div>
    </div>

    <!-- Live REST API Inspector -->
    <div class="inspector-section">
      <div class="inspector-header">
        <h3><span>📡</span> Live REST API Request & Response Inspector</h3>
        <span id="lastEndpointCalled" class="live-req">GET /api/internships</span>
      </div>
      <pre id="apiInspectorJson" class="inspector-body">{ "status": "Waiting for request..." }</pre>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="internshipModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Post New Internship</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      
      <div id="modalAlert" class="alert-error"></div>

      <form id="internshipForm">
        <input type="hidden" id="internshipId" value="">

        <div class="form-group">
          <label class="form-label">Job Title *</label>
          <input type="text" id="formTitle" class="form-control" placeholder="e.g. Full Stack Developer Intern" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Company Name *</label>
            <input type="text" id="formCompany" class="form-control" placeholder="e.g. TechNova Labs" required>
          </div>
          <div class="form-group">
            <label class="form-label">Domain *</label>
            <input type="text" id="formDomain" class="form-control" placeholder="e.g. Web Development" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Location *</label>
            <input type="text" id="formLocation" class="form-control" placeholder="e.g. Bengaluru, Karnataka / Remote" required>
          </div>
          <div class="form-group">
            <label class="form-label">Work Type *</label>
            <select id="formType" class="form-control" required>
              <option value="Remote">Remote</option>
              <option value="Hybrid">Hybrid</option>
              <option value="On-site">On-site</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Required Skills * (Comma separated)</label>
          <input type="text" id="formSkills" class="form-control" placeholder="e.g. React, Node.js, Express, SQLite" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Monthly Stipend (₹) *</label>
            <input type="number" id="formStipend" class="form-control" placeholder="e.g. 25000" min="0" required>
          </div>
          <div class="form-group">
            <label class="form-label">Duration *</label>
            <input type="text" id="formDuration" class="form-control" placeholder="e.g. 6 Months" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description *</label>
          <textarea id="formDescription" class="form-control" rows="3" placeholder="Describe the day-to-day responsibilities..." required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" id="cancelModalBtn" class="btn btn-outline">Cancel</button>
          <button type="submit" id="saveInternshipBtn" class="btn btn-primary">Save Internship</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // State management
    let currentPage = 1;
    const limit = 6;
    let totalPages = 1;
    let totalRecords = 0;

    // DOM Elements
    const grid = document.getElementById('internshipsGrid');
    const paginationInfo = document.getElementById('paginationInfo');
    const pageBadge = document.getElementById('pageBadge');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const searchInput = document.getElementById('searchInput');
    const domainFilter = document.getElementById('domainFilter');
    const typeFilter = document.getElementById('typeFilter');
    const inspectorJson = document.getElementById('apiInspectorJson');
    const inspectorReq = document.getElementById('lastEndpointCalled');

    // Modal elements
    const modal = document.getElementById('internshipModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalAlert = document.getElementById('modalAlert');
    const form = document.getElementById('internshipForm');
    const openCreateBtn = document.getElementById('openCreateModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelModalBtn');

    // Fetch Internships from the API
    async function loadInternships() {
      try {
        const params = new URLSearchParams({
          page: currentPage,
          limit: limit
        });

        if (searchInput.value.trim()) params.append('search', searchInput.value.trim());
        if (domainFilter.value) params.append('domain', domainFilter.value);
        if (typeFilter.value) params.append('type', typeFilter.value);

        const url = `/api/internships?${params.toString()}`;
        inspectorReq.textContent = `GET ${url}`;

        const res = await fetch(url);
        const data = await res.json();

        // Update live inspector
        inspectorJson.textContent = JSON.stringify(data, null, 2);

        if (!data.success) {
          grid.innerHTML = `<div class="empty-state">Failed to load internships: ${data.message}</div>`;
          return;
        }

        totalRecords = data.pagination.totalRecords;
        totalPages = data.pagination.totalPages;
        currentPage = data.pagination.currentPage;

        renderGrid(data.data);
        renderPagination(data.pagination);
      } catch (err) {
        console.error('API Fetch error:', err);
        inspectorJson.textContent = JSON.stringify({ error: err.message }, null, 2);
      }
    }

    // Render Cards
    function renderGrid(internships) {
      if (!internships || internships.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>No internships found</h3>
            <p>Try modifying your search or filter criteria.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = internships.map(item => {
        const typeClass = item.type.toLowerCase().includes('remote') ? 'type-remote'
          : item.type.toLowerCase().includes('hybrid') ? 'type-hybrid' : 'type-onsite';

        const skills = (item.skills || '')
          .split(',')
          .map(s => s.trim())
          .filter(Boolean);

        return `
          <div class="card" id="card-${item.id}">
            <div>
              <div class="card-header">
                <div>
                  <h3 class="card-title">${escapeHtml(item.title)}</h3>
                  <div class="card-company">${escapeHtml(item.company)}</div>
                </div>
                <span class="type-badge ${typeClass}">${escapeHtml(item.type)}</span>
              </div>

              <div class="card-meta">
                <span class="meta-item">📍 ${escapeHtml(item.location)}</span>
                <span class="meta-item">📁 ${escapeHtml(item.domain)}</span>
                <span class="meta-item">⏱️ ${escapeHtml(item.duration)}</span>
              </div>

              <p class="card-desc">${escapeHtml(item.description)}</p>

              <div class="skills-container">
                ${skills.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}
              </div>
            </div>

            <div class="card-footer">
              <div>
                <span class="stipend-label">STIPEND</span>
                <span class="stipend-badge">₹${Number(item.stipend).toLocaleString()}/mo</span>
              </div>
              <div class="card-actions">
                <button class="btn btn-outline btn-sm" onclick="handleEdit(${item.id})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="handleDelete(${item.id})">Delete</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render Pagination
    function renderPagination(pagination) {
      paginationInfo.textContent = `Showing ${pagination.totalRecords > 0 ? (pagination.currentPage - 1) * pagination.limit + 1 : 0} to ${Math.min(pagination.currentPage * pagination.limit, pagination.totalRecords)} of ${pagination.totalRecords} records`;
      pageBadge.textContent = `Page ${pagination.currentPage} of ${pagination.totalPages || 1}`;
      prevBtn.disabled = !pagination.hasPrevPage;
      nextBtn.disabled = !pagination.hasNextPage;
    }

    // Edit Handler
    window.handleEdit = async function(id) {
      try {
        const url = `/api/internships/${id}`;
        inspectorReq.textContent = `GET ${url}`;
        const res = await fetch(url);
        const data = await res.json();
        inspectorJson.textContent = JSON.stringify(data, null, 2);

        if (data.success && data.data) {
          const item = data.data;
          document.getElementById('internshipId').value = item.id;
          document.getElementById('formTitle').value = item.title;
          document.getElementById('formCompany').value = item.company;
          document.getElementById('formDomain').value = item.domain;
          document.getElementById('formLocation').value = item.location;
          document.getElementById('formType').value = item.type;
          document.getElementById('formSkills').value = item.skills;
          document.getElementById('formStipend').value = item.stipend;
          document.getElementById('formDuration').value = item.duration;
          document.getElementById('formDescription').value = item.description;

          modalTitle.textContent = `Edit Internship (#${item.id})`;
          modalAlert.style.display = 'none';
          modal.classList.add('active');
        }
      } catch (err) {
        alert('Failed to retrieve internship: ' + err.message);
      }
    };

    // Delete Handler
    window.handleDelete = async function(id) {
      if (!confirm(`Are you sure you want to delete internship ID #${id}?`)) return;

      try {
        const url = `/api/internships/${id}`;
        inspectorReq.textContent = `DELETE ${url}`;
        const res = await fetch(url, { method: 'DELETE' });
        const data = await res.json();
        inspectorJson.textContent = JSON.stringify(data, null, 2);

        if (data.success) {
          loadInternships();
        } else {
          alert('Delete failed: ' + data.message);
        }
      } catch (err) {
        alert('Delete error: ' + err.message);
      }
    };

    // Form Submission (Create or Update)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      modalAlert.style.display = 'none';

      const id = document.getElementById('internshipId').value;
      const payload = {
        title: document.getElementById('formTitle').value,
        company: document.getElementById('formCompany').value,
        domain: document.getElementById('formDomain').value,
        location: document.getElementById('formLocation').value,
        type: document.getElementById('formType').value,
        skills: document.getElementById('formSkills').value,
        stipend: parseFloat(document.getElementById('formStipend').value),
        duration: document.getElementById('formDuration').value,
        description: document.getElementById('formDescription').value
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `/api/internships/${id}` : '/api/internships';
      inspectorReq.textContent = `${method} ${url}`;

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        inspectorJson.textContent = JSON.stringify(data, null, 2);

        if (!data.success) {
          const errMsg = data.errors ? data.errors.map(e => `• ${e.message}`).join('<br>') : data.message;
          modalAlert.innerHTML = errMsg;
          modalAlert.style.display = 'block';
          return;
        }

        modal.classList.remove('active');
        loadInternships();
      } catch (err) {
        modalAlert.textContent = 'Network error: ' + err.message;
        modalAlert.style.display = 'block';
      }
    });

    // Helper to sanitize HTML
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Modal triggers
    openCreateBtn.addEventListener('click', () => {
      form.reset();
      document.getElementById('internshipId').value = '';
      modalTitle.textContent = 'Post New Internship';
      modalAlert.style.display = 'none';
      modal.classList.add('active');
    });

    closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    cancelBtn.addEventListener('click', () => modal.classList.remove('active'));

    // Pagination events
    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadInternships();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        loadInternships();
      }
    });

    // Filtering debounce
    let debounceTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        currentPage = 1;
        loadInternships();
      }, 300);
    });

    domainFilter.addEventListener('change', () => {
      currentPage = 1;
      loadInternships();
    });

    typeFilter.addEventListener('change', () => {
      currentPage = 1;
      loadInternships();
    });

    // Initial load
    loadInternships();
  </script>
</body>
</html>
